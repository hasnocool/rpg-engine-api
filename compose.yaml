services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: rpg
      POSTGRES_DB: rpg_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpg_engine"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - rpg-engine-postgres:/var/lib/postgresql/data

volumes:
  rpg-engine-postgres:
