services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpg_engine
      POSTGRES_USER: rpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - rpg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg -d rpg_engine"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RPG_ENGINE_APP_ENV: production
      RPG_ENGINE_PERSISTENCE_BACKEND: postgres
      RPG_ENGINE_DATABASE_URL: postgresql+asyncpg://rpg:${POSTGRES_PASSWORD}@postgres:5432/rpg_engine
      RPG_ENGINE_COMMAND_RATE_LIMIT_PER_MINUTE: ${RPG_ENGINE_COMMAND_RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - "${RPG_ENGINE_PORT:-8000}:8000"

volumes:
  rpg_pgdata:
